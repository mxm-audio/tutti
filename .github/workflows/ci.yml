name: CI

on:
  # Only by hand, from the Actions tab (the owner, 2026-10-07: pre-alpha, development speed
  # first, no tags). Pushes and pull requests start nothing.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Pinned, and moved on purpose: a new stable's lints must not turn a green tree red
      # overnight under `-D warnings`. The floor the crates declare is checked separately (MSRV).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The core has no file IO and no platform code: it must keep building for the web.
      - run: cargo build -p tutti --locked --target wasm32-unknown-unknown
      # The one-file form runs in a browser too (the JavaScript package's packZip and unpackZip).
      - run: cargo build -p tutti-zip --locked --target wasm32-unknown-unknown
      # The npm package: the wasm build, the generated document types current, the Node tests.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo install wasm-pack@0.15.0 --locked
      - run: npm ci
        working-directory: js
      - run: npm run build
        working-directory: js
      - run: npm run types && git diff --exit-code -- schema.d.ts
        working-directory: js
      - run: npm test
        working-directory: js
      # The browser build and its test, in WebKit and Chromium: once, on Linux.
      - run: npm run build:web
        if: runner.os == 'Linux'
        working-directory: js
      - run: npx playwright install --with-deps webkit chromium
        if: runner.os == 'Linux'
        working-directory: js
      - run: npm run test:browser
        if: runner.os == 'Linux'
        working-directory: js
